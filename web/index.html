<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Engine</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#34d399; --text:#e2e8f0;
      --muted:#94a3b8; --border:#334155; --user:#10b981; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,Segoe UI,sans-serif;
      background:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }
    header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    .pill { font-size:12px; color:var(--muted); border:1px solid var(--border); padding:2px 8px; border-radius:999px; }
    main { flex:1; max-width:820px; width:100%; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .row { display:flex; gap:8px; }
    textarea { flex:1; min-height:70px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel); color:var(--text); font-size:14px; resize:vertical; font-family:inherit; }
    input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel); color:var(--text); font-size:15px; }
    button { padding:12px 18px; border:none; border-radius:10px; background:var(--accent); color:#043527; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .chat { display:flex; flex-direction:column; gap:12px; }
    .msg { padding:12px 14px; border-radius:12px; max-width:85%; line-height:1.5; }
    .msg.user { align-self:flex-end; background:var(--user); color:#043527; }
    .msg.bot { align-self:flex-start; background:var(--panel); border:1px solid var(--border); }
    .cites { margin-top:8px; font-size:12px; color:var(--muted); }
    .cites summary { cursor:pointer; color:var(--accent); }
    .hint { color:var(--muted); font-size:13px; }
    h3 { margin:6px 0 0; font-size:14px; color:var(--muted); font-weight:600; }
    .examples { display:flex; flex-wrap:wrap; gap:8px; }
    .examples button { background:var(--panel); color:var(--text); border:1px solid var(--border);
      font-weight:400; font-size:13px; padding:8px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>📄 RAG Engine</h1>
    <span class="pill" id="backend">backend: …</span>
    <span class="pill" id="chunks">index: …</span>
  </header>
  <main>
    <p class="hint">Local vector RAG over any text corpus. Add a document, then ask
      questions — answers are retrieved from your indexed text and cited.</p>

    <h3>1. Ingest a document</h3>
    <div class="row">
      <textarea id="doc" placeholder="Paste document text here…"></textarea>
    </div>
    <div class="row">
      <input id="src" placeholder="source name (e.g. policy.txt)" value="pasted.txt" />
      <button id="ingest" type="button">Ingest</button>
    </div>

    <h3>2. Ask</h3>
    <div class="examples" id="examples">
      <button type="button">How long do I have to request a refund?</button>
      <button type="button">What is the SLA for priority incidents?</button>
      <button type="button">How long is personal data retained?</button>
      <button type="button">What are the password requirements?</button>
    </div>
    <div class="chat" id="chat"></div>
    <form id="form" class="row">
      <input id="q" placeholder="Ask about the ingested documents…" autocomplete="off" />
      <button id="send" type="submit">Ask</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
