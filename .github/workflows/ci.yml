name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, test & demo (offline backend)
    runs-on: ubuntu-latest
    env:
      RAG_OFFLINE: "1"   # no Ollama in CI; use the deterministic backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check src tests demo.py
      - name: Tests
        run: pytest -q
      - name: Demo smoke-run
        run: python demo.py

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t local-rag-docqa:ci .
